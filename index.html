<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 (404 Not Found)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: #4f46e5;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111827;
        }
        .error-message {
            font-size: 16px;
            color: #6b7280;
            line-height: 1.6;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">원하시는 페이지를 찾을 수 없습니다</h1>
        <p class="error-message">
            찾으려는 페이지의 주소가 잘못 입력되었거나,<br>
            주소의 변경 또는 삭제로 인해 현재 사용하실 수 없습니다.
        </p>
    </div>

</body>
</html>
