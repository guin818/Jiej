<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엄마 사랑해요❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            padding: 40px 60px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 75, 110, 0.2);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.05);
        }

        h1 {
            color: #ff4b6e;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: heartbeat 1.5s infinite alternate;
        }

        p {
            color: #4a4a4a;
            font-size: 1.5rem;
            line-height: 1.6;
        }

        /* 큰 하트 두근거리는 애니메이션 */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* 흩날리는 작은 하트 스타일 */
        .heart-particle {
            position: absolute;
            color: #ff758f;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) translateX(50px) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>엄마 사랑해❤️</h1>
        <p>세상에서 가장 소중한 우리 엄마,<br>언제나 고맙고 사랑해요!</p>
    </div>

    <script>
        // 배경에 하트 날리는 효과
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            
            // 하트 모양 랜덤 선택 (여러 모양)
            const heartShapes = ['❤️', '💖', '💗', '💕', '🥰'];
            heart.innerText = heartShapes[Math.floor(Math.random() * heartShapes.length)];
            
            // 랜덤 위치 및 크기 설정
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's'; // 2~5초 사이
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px'; // 15~35px 사이
            
            document.body.appendChild(heart);
            
            // 애니메이션 종료 후 요소 삭제
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // 300ms마다 하트 생성
        setInterval(createHeart, 300);
    </script>

</body>
</html>
