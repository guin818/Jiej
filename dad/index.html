<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아빠 사랑해요 최고👍</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.15);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.05);
        }

        h1 {
            color: #0284c7;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
            animation: bounce 1.5s infinite alternate;
        }

        p {
            color: #334155;
            font-size: 1.5rem;
            line-height: 1.6;
        }

        /* 둥실둥실 움직이는 애니메이션 */
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        /* 흩날리는 아이콘 스타일 */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) translateX(0) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) translateX(50px) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>아빠 사랑해❤️</h1>
        <p>우리 가족의 든든한 버팀목 아빠,<br>언제나 고맙고 사랑해요! 최고👍</p>
    </div>

    <script>
        // 배경에 하트와 별 날리는 효과
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // 아빠를 위한 이모지 랜덤 선택
            const shapes = ['❤️', '⭐', '✨', '💙', '👍', '🥰'];
            particle.innerText = shapes[Math.floor(Math.random() * shapes.length)];
            
            // 랜덤 위치, 속도, 크기 설정
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 3 + 2) + 's'; // 2~5초 사이
            particle.style.fontSize = (Math.random() * 20 + 15) + 'px'; // 15~35px 사이
            
            document.body.appendChild(particle);
            
            // 애니메이션 종료 후 삭제
            setTimeout(() => {
                particle.remove();
            }, 5000);
        }

        // 300ms마다 생성
        setInterval(createParticle, 300);
    </script>

</body>
</html>
