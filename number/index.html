<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>반응형 숫자 맞히기 게임</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f3f5;
            overscroll-behavior-y: none; 
        }

        /* 반응형 뷰포트 레이아웃 */
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 5vw; /* 화면 크기에 비례하는 안쪽 여백 */
        }

        /* 유연한 반응형 컨테이너 */
        .game-container {
            background-color: white;
            padding: 6vh 4vw; /* 높이와 너비에 비례한 유연한 여백 */
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 420px; /* PC/태블릿에서 지나치게 커지는 것 방지 */
            min-width: 280px; /* 아주 작은 화면에서 깨지는 것 방지 */
            transition: all 0.3s ease;
        }

        /* 반응형 타이포그래피 (clamp 활용) */
        h1 {
            color: #212529;
            /* 최소 1.4rem, 기본 4vw, 최대 2rem 사이에서 자동 조절 */
            font-size: clamp(1.4rem, 4vw, 2rem); 
            margin-top: 0;
            margin-bottom: 12px;
        }

        p {
            color: #495057;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            margin-bottom: 8%;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 100%;
            height: clamp(48px, 12vh, 58px); /* 화면 높이에 따라 유연한 폼 크기 */
            font-size: clamp(1.2rem, 3.5vw, 1.5rem);
            text-align: center;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }

        input[type="number"]:focus {
            border-color: #339af0;
            box-shadow: 0 0 0 3px rgba(51, 154, 240, 0.2);
        }

        button {
            width: 100%;
            height: clamp(48px, 12vh, 58px);
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            font-weight: bold;
            background-color: #339af0;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            background-color: #1c7ed6;
            transform: scale(0.98);
        }

        .result-message {
            margin: 6% 0 3% 0;
            font-size: clamp(1.1rem, 3.5vw, 1.4rem);
            font-weight: bold;
            min-height: 35px;
        }

        .attempts {
            margin: 0;
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: #868e96;
        }

        .restart-btn {
            background-color: #51cf66;
            margin-top: 20px;
            display: none;
        }

        .restart-btn:active {
            background-color: #37b24d;
        }

        /* 🖥️ PC 또는 가로가 긴 태블릿을 위한 미디어 쿼리 최적화 */
        @media (min-width: 768px) {
            .game-container {
                padding: 40px;
            }
            .input-group {
                flex-direction: row; /* 큰 화면에서는 가로 배치로 변경 */
                gap: 10px;
            }
            input[type="number"] {
                flex: 2; /* 입력창이 더 넓게 */
            }
            button {
                flex: 1; /* 버튼은 적당하게 */
            }
            .restart-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="game-container">
        <h1>숫자 맞히기 🎮</h1>
        <p>1부터 100 사이의 숫자를 맞춰보세요!</p>
        
        <div id="input-area" class="input-group">
            <input type="number" id="guess-input" inputmode="numeric" pattern="[0-9]*" min="1" max="100" placeholder="숫자 입력">
            <button onclick="checkGuess()">확인</button>
        </div>
    
        <p class="result-message" id="result-text"></p>
        <p class="attempts" id="attempts-text">시도 횟수: 0회</p>
        
        <button class="restart-btn" id="restart-button" onclick="resetGame()">다시 시작하기</button>
    </div>
</div>

<script>
    document.addEventListener('touchmove', function(e) {
        e.preventDefault();
    }, { passive: false });

    let targetNumber = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;

    const guessInput = document.getElementById('guess-input');
    const resultText = document.getElementById('result-text');
    const attemptsText = document.getElementById('attempts-text');
    const restartButton = document.getElementById('restart-button');
    const inputArea = document.getElementById('input-area');

    guessInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkGuess();
            guessInput.blur(); 
        }
    });

    function checkGuess() {
        const userGuess = parseInt(guessInput.value);

        if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
            resultText.style.color = '#fa5252';
            resultText.textContent = '1~100 사이 숫자를 입력하세요!';
            return;
        }

        attempts++;
        attemptsText.textContent = `시도 횟수: ${attempts}회`;

        if (userGuess === targetNumber) {
            resultText.style.color = '#40c057';
            resultText.textContent = `정답입니다! 🎉 (${attempts}회)`;
            endGame();
        } else if (userGuess < targetNumber) {
            resultText.style.color = '#15aabf';
            resultText.textContent = 'UP ⬆️ (더 높은 숫자)';
        } else {
            resultText.style.color = '#15aabf';
            resultText.textContent = 'DOWN ⬇️ (더 낮은 숫자)';
        }

        guessInput.value = '';
    }

    function endGame() {
        inputArea.style.display = 'none';
        restartButton.style.display = 'block';
    }

    function resetGame() {
        targetNumber = Math.floor(Math.random() * 100) + 1;
        attempts = 0;
        
        resultText.textContent = '';
        attemptsText.textContent = '시도 횟수: 0회';
        guessInput.value = '';
        
        // 반응형 레이아웃 복구를 위해 display 설정 최적화
        inputArea.style.display = window.innerWidth >= 768 ? 'flex' : 'flex'; 
        restartButton.style.display = 'none';
    }
</script>

</body>
</html>
