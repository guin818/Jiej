<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft BGM Player</title>
    <!-- 마인크래프트 감성의 픽셀 폰트 로드 -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --mc-green: #5b8731;
            --mc-dark: #212121;
            --mc-light: #e0e0e0;
        }

        body {
            font-family: 'Press Start 2P', cursive, sans-serif;
            background-color: var(--mc-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #3a3a3a 0%, #1a1a1a 100%);
        }

        .player-container {
            background-color: #4a4a4a;
            border: 6px solid #2a2a2a;
            box-shadow: inset -4px -4px 0px #3a3a3a, inset 4px 4px 0px #6a6a6a;
            padding: 30px;
            width: 400px;
            text-align: center;
            border-radius: 4px;
        }

        h1 {
            font-size: 14px;
            color: #ffaa00;
            text-shadow: 2px 2px #3f2a00;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .track-info {
            background-color: #151515;
            border: 4px solid #333;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 10px;
            color: #55ff55;
            text-shadow: 1px 1px #003f00;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .btn {
            font-family: 'Press Start 2P', cursive, sans-serif;
            font-size: 14px;
            color: var(--mc-light);
            background-color: #7c7c7c;
            border: 3px solid black;
            box-shadow: inset -3px -3px 0px #5a5a5a, inset 3px 3px 0px #aeaeae;
            padding: 15px 30px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: #8c8c8c;
            color: #fffb00;
        }

        .btn:active {
            box-shadow: inset 3px 3px 0px #5a5a5a, inset -3px -3px 0px #aeaeae;
            padding-top: 17px;
            padding-bottom: 13px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 8px;
            color: #aaa;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 60%;
            background: #222;
            height: 8px;
            border: 2px solid #555;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            background: var(--mc-green);
            width: 16px;
            height: 16px;
            border: 2px solid black;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>MINECRAFT PLAYER</h1>
        
        <div class="track-info" id="track-name">
            재생 준비 완료
        </div>

        <div class="controls">
            <button class="btn" id="play-btn">▶ PLAY</button>
        </div>

        <div class="volume-container">
            <span>VOL</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5">
        </div>
    </div>

    <script>
        const playBtn = document.getElementById('play-btn');
        const trackName = document.getElementById('track-name');
        const volumeSlider = document.getElementById('volume-slider');

        let audioContext = null;
        let audioBuffer = null;
        let audioSource = null;
        let gainNode = null;
        let isPlaying = false;
        let startTime = 0;
        let pausedAt = 0;

        async function loadLocalFile() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    gainNode = audioContext.createGain();
                    gainNode.connect(audioContext.destination);
                    gainNode.gain.setValueAtTime(volumeSlider.value, audioContext.currentTime);
                }

                const response = await fetch('1.mp3');
                if (!response.ok) throw new Error();
                
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                return true;
            } catch (error) {
                trackName.textContent = "에러: 1.mp3 파일 없음";
                alert("같은 폴더에 '1.mp3' 파일이 있는지 확인해 주세요!");
                return false;
            }
        }

        function playTrack() {
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.loop = true;
            audioSource.connect(gainNode);

            startTime = audioContext.currentTime - pausedAt;
            audioSource.start(0, pausedAt % audioBuffer.duration);
            
            isPlaying = true;
            playBtn.textContent = "▮▮ PAUSE";
            // 요청하신 대로 말줄임표 없이 깔끔하게 수정
            trackName.textContent = "마인크래프트 배경 음악 재생 중";
        }

        function pauseTrack() {
            if (audioSource) {
                audioSource.stop();
                pausedAt = audioContext.currentTime - startTime;
            }
            isPlaying = false;
            playBtn.textContent = "▶ PLAY";
            trackName.textContent = "일시정지됨";
        }

        playBtn.addEventListener('click', async function() {
            if (!audioBuffer) {
                trackName.textContent = "파일 로딩 중";
                const success = await loadLocalFile();
                if (!success) return;
            }

            if (isPlaying) {
                pauseTrack();
            } else {
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                playTrack();
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            if (gainNode) {
                gainNode.gain.setValueAtTime(e.target.value, audioContext.currentTime);
            }
        });
    </script>
</body>
</html>
